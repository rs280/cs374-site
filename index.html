<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>cs374</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body {
        display: grid;
        place-items: center;
        background: #0b0d12;
        color: #e6e8ee;
        font: 15px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        padding: 24px;
      }
      .card { width: 100%; max-width: 340px; text-align: center; }
      h1 {
        font-size: 13px;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        font-weight: 600;
        color: #7d87a0;
        margin: 0 0 22px;
      }
      form { display: flex; flex-direction: column; gap: 10px; }
      input {
        width: 100%;
        padding: 11px 13px;
        border-radius: 9px;
        border: 1px solid #262c3a;
        background: #12151d;
        color: inherit;
        font: inherit;
        text-align: center;
      }
      input:focus { outline: none; border-color: #4c6ef5; }
      button {
        padding: 11px 13px;
        border-radius: 9px;
        border: 0;
        background: #4c6ef5;
        color: #fff;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
      button:disabled { opacity: 0.55; cursor: default; }
      label {
        display: flex;
        gap: 7px;
        align-items: center;
        justify-content: center;
        font-size: 13px;
        color: #7d87a0;
        cursor: pointer;
      }
      label input { width: auto; }
      .msg { min-height: 20px; font-size: 13px; color: #7d87a0; margin-top: 12px; }
      .msg.err { color: #ff8686; }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>cs374</h1>
      <form id="f">
        <input
          id="pw"
          type="password"
          placeholder="password"
          autocomplete="current-password"
          autofocus
        />
        <button id="go" type="submit">Unlock</button>
        <label><input id="remember" type="checkbox" checked /> remember on this device</label>
      </form>
      <div class="msg" id="msg"></div>
    </div>

    <script>
      // Everything below the gate is AES-256-GCM ciphertext; the key is derived
      // from the password with PBKDF2 and never leaves the browser.
      const CFG = {"salt":"ru0NDMo442lIBoG1kG6ojA==","iterations":600000,"payload":"payload.bin","check":"hR3o7CVZ7s1s3qXjqIR7XEbxISm/qeKEdWsvzU8E13Oh"};
      const KEY_STORE = "cs374.key";
      const enc = new TextEncoder();
      const msg = document.getElementById("msg");
      const form = document.getElementById("f");
      const pwInput = document.getElementById("pw");
      const goBtn = document.getElementById("go");

      const b64ToBytes = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
      const bytesToB64 = (b) => btoa(String.fromCharCode(...new Uint8Array(b)));

      function say(text, isError) {
        msg.textContent = text;
        msg.className = isError ? "msg err" : "msg";
      }

      async function deriveKey(password) {
        const base = await crypto.subtle.importKey("raw", enc.encode(password), "PBKDF2", false, [
          "deriveKey",
        ]);
        return crypto.subtle.deriveKey(
          {
            name: "PBKDF2",
            salt: b64ToBytes(CFG.salt),
            iterations: CFG.iterations,
            hash: "SHA-256",
          },
          base,
          { name: "AES-GCM", length: 256 },
          true,
          ["decrypt"]
        );
      }

      // Each encrypted blob is [12-byte IV][ciphertext+tag].
      async function decrypt(key, buf) {
        const bytes = new Uint8Array(buf);
        return crypto.subtle.decrypt(
          { name: "AES-GCM", iv: bytes.subarray(0, 12) },
          key,
          bytes.subarray(12)
        );
      }

      async function gunzip(buf) {
        const stream = new Blob([buf]).stream().pipeThrough(new DecompressionStream("gzip"));
        return new Response(stream).text();
      }

      async function checkKey(key) {
        try {
          await decrypt(key, b64ToBytes(CFG.check).buffer);
          return true;
        } catch {
          return false;
        }
      }

      // Exam PDFs are encrypted too, so links have to be decrypted on click.
      // The blank tab is opened synchronously to stay inside the user gesture.
      function installPdfHandler(key) {
        document.addEventListener(
          "click",
          (e) => {
            const link = e.target instanceof Element ? e.target.closest("a[href]") : null;
            if (!link || e.defaultPrevented || e.metaKey || e.ctrlKey || e.button !== 0) return;
            const url = new URL(link.href, location.href);
            if (url.origin !== location.origin || !url.pathname.endsWith(".pdf")) return;
            e.preventDefault();
            const tab = window.open("", "_blank");
            if (tab) tab.document.write("<title>decrypting...</title>");
            fetch(url.pathname + ".enc")
              .then((r) => {
                if (!r.ok) throw new Error(r.status);
                return r.arrayBuffer();
              })
              .then((buf) => decrypt(key, buf))
              .then((plain) => {
                // Keep #page=N so the library's chapter links still land on
                // the right page once the PDF is decrypted.
                const blobUrl =
                  URL.createObjectURL(
                    new Blob([plain], { type: "application/pdf" })
                  ) + url.hash;
                if (tab) tab.location.replace(blobUrl);
                else window.location.href = blobUrl;
              })
              .catch(() => {
                if (tab) tab.close();
                say("could not open that PDF", true);
              });
          },
          true
        );
      }

      async function unlock(key) {
        say("decrypting...");
        const res = await fetch(CFG.payload);
        if (!res.ok) throw new Error("payload " + res.status);
        const html = await gunzip(await decrypt(key, await res.arrayBuffer()));
        installPdfHandler(key);
        const doc = new DOMParser().parseFromString(html, "text/html");
        document.documentElement.replaceWith(doc.documentElement);
        // Scripts moved in from another document are inert; re-create them.
        for (const old of Array.from(document.querySelectorAll("script"))) {
          const fresh = document.createElement("script");
          for (const attr of old.attributes) fresh.setAttribute(attr.name, attr.value);
          fresh.textContent = old.textContent;
          old.replaceWith(fresh);
        }
      }

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        goBtn.disabled = true;
        say("checking...");
        try {
          const key = await deriveKey(pwInput.value);
          if (!(await checkKey(key))) {
            say("wrong password", true);
            goBtn.disabled = false;
            pwInput.select();
            return;
          }
          if (document.getElementById("remember").checked) {
            const raw = await crypto.subtle.exportKey("raw", key);
            localStorage.setItem(KEY_STORE, bytesToB64(raw));
          }
          await unlock(key);
        } catch (err) {
          say(String(err && err.message ? err.message : err), true);
          goBtn.disabled = false;
        }
      });

      (async function resume() {
        const saved = localStorage.getItem(KEY_STORE);
        if (!saved) return;
        try {
          const key = await crypto.subtle.importKey(
            "raw",
            b64ToBytes(saved),
            { name: "AES-GCM", length: 256 },
            true,
            ["decrypt"]
          );
          if (!(await checkKey(key))) {
            localStorage.removeItem(KEY_STORE);
            return;
          }
          await unlock(key);
        } catch {
          localStorage.removeItem(KEY_STORE);
        }
      })();
    </script>
  </body>
</html>
